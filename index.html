<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平板借用系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111827; --ink-soft: #4b5563; --bg-app: #f9fafb; --bg-panel: #ffffff;
    --border: #d1d5db; --border-soft: #e5e7eb; 
    --accent: #2563eb; --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff; --danger: #ef4444; --danger-bg: #fef2f2; --ok: #10b981;
    --radius: 8px; --radius-sm: 6px; --radius-pill: 99px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-app); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  
  .app { max-width: 1040px; margin: 0 auto; padding: 24px 20px 80px; }

  /* Theme Pills */
  .theme-blue { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
  .theme-green { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
  .theme-red { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
  .theme-orange { background: #fff7ed; color: #9a3412; border: 1px solid #ffedd5; }
  .theme-purple { background: #faf5ff; color: #6b21a8; border: 1px solid #f3e8ff; }
  .theme-gray { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

  /* Topbar */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: 24px; color: #111827; }
  .topbar p { margin: 6px 0 0; color: var(--ink-soft); font-size: 13.5px; font-weight: 500; }
  
  .tabs { display: flex; gap: 4px; background: #e5e7eb; padding: 4px; border-radius: var(--radius-pill); }
  .tabs button { border: none; background: transparent; padding: 6px 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 13px; color: var(--ink-soft); cursor: pointer; transition: 0.2s ease; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }

  /* Navigation & Notice */
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .weeknav .range { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #1f2937; }
  .nav-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-panel); cursor: pointer; font-size: 15px; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; transition: 0.15s; }
  .nav-btn:hover { background: var(--bg-app); color: var(--ink); }
  .today-btn { border: 1px solid var(--border); background: var(--bg-panel); padding: 6px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-soft); transition: 0.15s; }
  .today-btn:hover { background: var(--bg-app); color: var(--ink); }

  .notice { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 500; margin-bottom: 20px; line-height: 1.5; }

  /* =========================================
     雙軌制渲染：電腦版 (二維表格)
     ========================================= */
  .desktop-only { display: block; }
  .mobile-only { display: none; }
  
  .table-wrap { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
  .desktop-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .desktop-table th, .desktop-table td { border: 1px solid var(--border-soft); vertical-align: top; }
  .desktop-table thead th { background: #f9fafb; padding: 12px 8px; text-align: center; font-weight: 700; font-size: 13.5px; color: #374151; }
  .desktop-table thead th .date { display: block; font-weight: 500; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .desktop-table tbody th { background: #f9fafb; font-weight: 700; font-size: 13px; color: var(--ink-soft); vertical-align: middle; text-align: center; width: 65px; border-right: 1px solid var(--border-soft); }
  
  .desktop-table td { padding: 0; background: #fff; height: 1px; }
  
  .slot-wrapper { 
    display: flex; flex-direction: column; gap: 6px; 
    min-height: 72px; height: 100%; 
    justify-content: flex-start; 
    padding: 8px; 
    margin: 0; 
    transition: all 0.2s ease; 
    box-sizing: border-box;
  }
  .slot-wrapper.disabled { background: #f9fafb; opacity: 0.85; }
  .slot-wrapper.disabled-click { pointer-events: none; }
  
  .slot-wrapper:not(.disabled-click):not(.admin-mode):hover { 
    background: #f8fafc; 
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  /* =========================================
     共用元件 (Pill & Button & Status)
     ========================================= */
  .pill { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 4px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; line-height: 1.3; text-align: center; }
  .pill .who { font-weight: 500; font-size: 11.5px; opacity: 0.85; margin-top: 2px; }
  
  .add-booking-btn { 
    background: #fff; 
    border: 1px dashed var(--accent); 
    color: var(--accent); 
    border-radius: var(--radius-sm); 
    padding: 6px 4px; 
    font-size: 12.5px; 
    font-weight: 700; 
    cursor: pointer; 
    transition: 0.15s; 
    width: 100%; 
    text-align: center; 
    display: flex; 
    justify-content: center; 
    opacity: 0; 
    pointer-events: none; 
    margin: auto 0; 
  }
  .add-booking-btn:hover { background: var(--accent-soft); }
  .slot-wrapper:not(.disabled-click):not(.admin-mode):hover .add-booking-btn { 
    opacity: 1; 
    pointer-events: auto; 
  }
  
  .status-text { font-size: 12px; font-weight: 600; color: #9ca3af; text-align: center; margin-top: 8px; }

  /* =========================================
     雙軌制渲染：手機版 (單欄堆疊與微提示)
     ========================================= */
  @media (max-width: 768px) { 
    .app { padding: 16px 14px 60px; } 
    .desktop-only { display: none !important; }
    .mobile-only { display: flex; flex-direction: column; gap: 20px; }
    
    .day-column { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel); box-shadow: var(--shadow-sm); overflow: hidden; }
    .day-header { position: sticky; top: 0; z-index: 10; font-size: 14.5px; font-weight: 700; color: #111827; padding: 12px 10px; background: #f8fafc; border-bottom: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .day-header .date { display: inline-block; margin-left: 6px; margin-top: 0; font-size: 13px; font-weight: 500; color: var(--ink-soft); }
    
    .mobile-slot { padding: 14px 12px; border-bottom: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 8px; }
    .mobile-slot:last-child { border-bottom: none; }
    .mobile-slot.disabled { background: #f9fafb; opacity: 0.85; }
    .mobile-slot.disabled-click { pointer-events: none; }
    
    .mobile-period-label { font-size: 13.5px; font-weight: 700; color: #4b5563; border-left: 3px solid var(--accent); padding-left: 8px; }
    
    .pill { flex-direction: row; justify-content: space-between; padding: 8px 12px; }
    .pill .who { margin-top: 0; font-size: 12.5px; }
    
    .add-booking-btn { 
      opacity: 1; 
      pointer-events: auto;
      background: transparent;
      border: 1px dashed #cbd5e1;
      color: #94a3b8;
      padding: 10px;
      margin-top: 0;
    }
    .add-booking-btn:active { background: #f1f5f9; }
    .status-text { text-align: left; margin-top: 0; font-size: 13px; }
  }

  /* =========================================
     Modal, Form & Admin UI 
     ========================================= */
  .overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--bg-panel); border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow-y: auto; animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
  
  .modal h3 { font-size: 18px; margin-bottom: 6px; color: #111827; }
  .modal .sub { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 20px; font-weight: 500; }
  
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
  .field input, .field select { width: 100%; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); font-size: 14px; font-family: inherit; background: #fff; transition: 0.2s; box-shadow: var(--shadow-sm); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
  
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.15s; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.ghost { background: var(--bg-app); color: #4b5563; border: 1px solid var(--border); }
  .btn.ghost:hover { background: var(--border-soft); color: #111827; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.danger:hover { background: #dc2626; }
  .err { background: var(--danger-bg); color: var(--danger); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 500; margin-bottom: 16px; border: 1px solid #fecaca; }

  .block-grid { width: 100%; border-collapse: collapse; margin-top: 8px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
  .block-grid th { background: #f9fafb; color: #374151; padding: 6px 4px; font-size: 12.5px; border: 1px solid var(--border); font-weight: 600; }
  .block-grid td { border: 1px solid var(--border); padding: 0; height: 34px; cursor: pointer; background: #fff; transition: 0.1s; text-align: center; font-size: 12.5px; }
  .block-grid td.is-blocked { background: var(--danger-bg); color: var(--danger); font-weight: bold; }
  .block-grid td:hover { background: #f3f4f6; }
  .block-grid td:first-child { background: #f9fafb; cursor: default; font-weight: 600; color: var(--ink-soft); pointer-events: none; }

  .admin-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  
  .list-wrap { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow-x: auto; }
  .list-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 600px; }
  .list-table th { text-align: left; background: #f9fafb; padding: 10px 14px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; border-bottom: 1px solid var(--border); }
  .list-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .edit-link { border: none; background: #eff6ff; color: #1d4ed8; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 10px; border-radius: 6px; transition: 0.15s; }
  .edit-link:hover { background: #bfdbfe; }
  .cancel-link { border: none; background: #fee2e2; color: #b91c1c; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 12px; border-radius: 6px; transition: 0.15s; }
  .cancel-link:hover { background: #f87171; color: #fff; }
  
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(4px); color: #fff; padding: 10px 20px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 100; text-align: center; animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="padding:100px; text-align:center; font-weight:500; color:#6b7280;">
    <h2 style="color: #2563eb; margin-bottom: 10px;">🔄 身分驗證中...</h2>
    系統安全載入中，請稍候
  </div>
</div>

<script>
(function(){
  // ==========================================
  // ⚙️ SSO 系統設定區
  // ==========================================
  const SSO_CENTER_URL = "https://cjh123-coder.github.io/sso/"; 
  const CURRENT_APP_URL = "https://cjh123-coder.github.io/ipad/";
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwX6yX7iE4XFDltH1CnwUv937Ezl8a0thiveCFlr7Pat5jQJGrl76VTjdmluZ6ASY3f/exec"; // 請填入您最新的平板系統 GAS 部署網址

  const PERIODS = ['第一節','第二節','第三節','第四節','第五節','第六節','第七節','第八節'];
  const WEEKDAY_LABEL = ['日','一','二','三','四','五','六'];
  const MIN_LEAD_DAYS = 3;
  const THEMES = { blue:'藍色', green:'綠色', red:'紅色', orange:'橘黃', purple:'紫色', gray:'灰色' };

  // 全域狀態：移除了密碼認證，加入 userData
  let state = {
    tab: 'teacher', weekStart: getMonday(new Date()),
    bookings: {}, carts: [],
    modal: null, cartModal: null, loaded: false,
    userData: null, // 存放登入者的資料
    toast: null, confirmCancelKey: null, confirmDeleteCartId: null, filterLocation: ''
  };

  // 輔助函數
  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getMonday(d){ const nd = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const day = nd.getDay(); nd.setDate(nd.getDate() + (day === 0 ? -6 : 1 - day)); return nd; }
  function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
  function startOfToday(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }
  function weekDates(monday){ return [0,1,2,3,4].map(i => addDays(monday,i)); }
  function fmtRange(monday){ const fri = addDays(monday,4); return `${monday.getMonth()+1}/${monday.getDate()} – ${fri.getMonth()+1}/${fri.getDate()}`; }
  function keyOf(date, periodIdx, cartId){ return date+'|'+periodIdx+'|'+cartId; }
  function isBookable(date){ return daysBetween(startOfToday(), new Date(date.getFullYear(), date.getMonth(), date.getDate())) >= MIN_LEAD_DAYS; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  
  // 權限判斷函式 (與後端呼應)
  function checkIsAdmin(user) {
    if(!user) return false;
    const adminRoles = ['admin', 'assistant', 'director']; 
    return adminRoles.includes(user.roleId);
  }

  let toastTimer = null;
  function showToast(msg){
    state.toast = msg; render();
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ state.toast = null; render(); }, 3000);
  }

  // ==========================================
  // 🚀 API 呼叫器 (自動夾帶 SessionId 強化安全)
  // ==========================================
  async function callServer(fnName, ...args) {
    try {
      const sessionId = localStorage.getItem('ipadSessionId') || "";
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: fnName,
          args: args,
          sessionId: sessionId // 每次請求都帶上通行證
        })
      });

      const result = await response.json();
      if (result.status === 'success') {
        return result.data;
      } else {
        // 如果後端拋出 Session 無效，立刻啟動登出機制
        if(result.message.includes("Session 無效") || result.message.includes("請重新登入")) {
          alert("登入逾時或無效，請重新登入！");
          handleLogout(false);
          throw new Error("SESSION_EXPIRED");
        }
        throw new Error(result.message);
      }
    } catch (error) {
      console.error('API Error:', error);
      throw error;
    }
  }

  // ==========================================
  // 🛑 閒置防護與登出機制
  // ==========================================
  let idleTimer;
  const IDLE_TIMEOUT_MS = 10 * 60 * 1000; // 10分鐘未動作自動登出

  function resetIdleTimer() {
    if (!localStorage.getItem('ipadUserData')) return;
    localStorage.setItem('ipadLastActive', Date.now().toString());
    clearTimeout(idleTimer);
    
    idleTimer = setTimeout(() => {
      console.log("偵測到閒置超過 10 分鐘，啟動強制登出...");
      alert("⏳ 您已閒置超過 10 分鐘，系統基於安全考量已將您登出。");
      handleLogout(false);
    }, IDLE_TIMEOUT_MS);
  }

  function setupIdleProtection() {
    ['mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach(event => {
      document.addEventListener(event, resetIdleTimer);
    });
    resetIdleTimer();
  }

  async function handleLogout(notifyServer = true) {
    if(notifyServer) {
      try { await callServer('logoutSession'); } catch(e) {}
    }
    localStorage.removeItem('ipadUserData');
    localStorage.removeItem('ipadSessionId');
    localStorage.removeItem('ipadLastActive');
    window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
  }

  // ==========================================
  // 🛡️ SSO 守門員機制 (網頁載入時第一時間執行)
  // ==========================================
  async function initGatekeeper() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // 1. 如果網址上有 Token，進行身分兌換
    if (token) {
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'verifyIpadLogin', args: [token], sessionId: "" })
        });
        const result = await response.json();
        
        if (result.status === 'success' && result.data.success) {
          // 儲存資料並抹除網址上的 Token
          localStorage.setItem('ipadUserData', JSON.stringify(result.data.userData));
          localStorage.setItem('ipadSessionId', result.data.sessionId);
          window.location.replace(CURRENT_APP_URL);
          return; // 終止後續執行，等待重新載入
        } else {
          alert("身分驗證失敗：" + (result.data ? result.data.message : result.message));
          window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
          return;
        }
      } catch (err) {
        alert("伺服器連線異常，請重試！");
        window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
        return;
      }
    }

    // 2. 檢查是否有本地 Session
    const localUser = localStorage.getItem('ipadUserData');
    const localSession = localStorage.getItem('ipadSessionId');

    if (localUser && localSession) {
      // 已登入：啟動系統
      state.userData = JSON.parse(localUser);
      setupIdleProtection();
      loadBookings();
    } else {
      // 未登入：強制跳轉 SSO
      window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
    }
  }

  async function loadBookings(){
    try{
      const [bData, cData] = await Promise.all([ callServer('getBookings'), callServer('getCarts') ]);
      state.bookings = bData || {}; state.carts = cData || [];
    }catch(e){ state.bookings = {}; state.carts = []; }
    state.loaded = true; render();
  }

  async function refreshFromServer(){
    try{
      const [bData, cData] = await Promise.all([ callServer('getBookings'), callServer('getCarts') ]);
      state.bookings = bData || {}; state.carts = cData || [];
    }catch(e){ }
  }

  // ==========================================
  // UI 渲染邏輯
  // ==========================================
  function render(){
    const app = document.getElementById('app');
    if(!state.loaded){ return; }
    app.innerHTML = `
      ${renderTopbar()}
      ${state.tab === 'teacher' ? renderTeacher() : renderAdmin()}
      ${state.modal ? renderModal() : ''}
      ${state.cartModal ? renderCartModal() : ''}
      ${state.confirmCancelKey ? renderCancelConfirm(state.confirmCancelKey) : ''}
      ${state.confirmDeleteCartId ? renderDeleteCartConfirm(state.confirmDeleteCartId) : ''}
      ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
    `;
    bindEvents();
  }

  function renderTopbar(){
    const activeCarts = state.carts.filter(c => c.enabled);
    const userRoleText = checkIsAdmin(state.userData) ? ' (管理員)' : '';

    return `
      <div class="topbar">
        <div>
          <h1>平板借用系統</h1>
          <p>目前共登錄 ${activeCarts.length} 台可借用設備 · 歡迎回來，<strong style="color:var(--accent);">${escapeHtml(state.userData.name)}</strong> 老師${userRoleText}！</p>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="tabs">
            <button data-tab="teacher" class="${state.tab==='teacher'?'active':''}">設備預約</button>
            ${checkIsAdmin(state.userData) ? `<button data-tab="admin" class="${state.tab==='admin'?'active':''}">管理後台</button>` : ''}
          </div>
          <button class="btn ghost" style="padding:6px 12px; font-size:12px; box-shadow:var(--shadow-sm);" id="logoutBtn">登出</button>
        </div>
      </div>
    `;
  }

  function renderLocationFilter() {
    const locs = [...new Set(state.carts.map(c => (c.location || '').trim()).filter(Boolean))];
    if (locs.length === 0) return '';
    return `
      <select id="locationFilter" style="padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); font-size:13px; font-weight:500; background:#fff; cursor:pointer; color:var(--ink);">
        <option value="">全部地點</option>
        ${locs.map(l => `<option value="${escapeHtml(l)}" ${state.filterLocation===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
      </select>
    `;
  }

  function renderWeekNav(){
    return `
      <div class="weeknav">
        <div class="range">
          <button class="nav-btn" data-nav="-1">‹</button>
          <span>${fmtRange(state.weekStart)}</span>
          <button class="nav-btn" data-nav="1">›</button>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          ${renderLocationFilter()}
          <button class="today-btn" data-nav="0">回到本週</button>
        </div>
      </div>
    `;
  }

  function getCellContent(date, periodIdx, adminMode){
    const dateStr = fmt(date);
    const day = date.getDay();
    const bookable = isBookable(date);
    const activeCarts = state.filterLocation ? state.carts.filter(c => (c.location || '').trim() === state.filterLocation) : state.carts;
    const cellBookings = activeCarts.map(c => state.bookings[keyOf(dateStr, periodIdx, c.cartId)]).filter(b => b);
    let html = '';
    
    cellBookings.forEach(b => {
      const cartInfo = activeCarts.find(c => c.cartId === b.cart) || {name: '未知', colorTheme: 'gray'};
      const extraAttr = adminMode ? `data-cancel-key="${keyOf(dateStr, periodIdx, b.cart)}" style="cursor:pointer;" title="點擊取消借用"` : `title="${escapeHtml(b.className)} / ${escapeHtml(b.teacher)}"`;
      html += `<div class="pill theme-${cartInfo.colorTheme}" ${extraAttr}><span>${escapeHtml(cartInfo.name)}</span><span class="who">${escapeHtml(b.className)}</span></div>`;
    });

    const availableCarts = activeCarts.filter(c => {
      if (!c.enabled) return false;
      if ((c.blockedPeriods || []).includes(`${day}_${periodIdx}`)) return false;
      if (state.bookings[keyOf(dateStr, periodIdx, c.cartId)]) return false;
      return true;
    });

    let isDisabled = false;
    let isClickDisabled = false;

    if (!adminMode && !bookable) {
      isDisabled = true; isClickDisabled = true;
      html += `<div class="status-text">未滿3天</div>`;
    } else if (availableCarts.length === 0 && activeCarts.length > 0) {
      isDisabled = true;
      if (!adminMode) isClickDisabled = true;
      html += `<div class="status-text">已額滿</div>`;
    } else if (availableCarts.length > 0) {
      html += `<button class="add-booking-btn" data-date="${dateStr}" data-period="${periodIdx}">＋ 預約</button>`;
    }
    return { html, isDisabled, isClickDisabled };
  }

  function renderTeacher(){
    const dates = weekDates(state.weekStart);
    return `
      ${renderWeekNav()}
      <div class="notice">登記須於使用日期 <strong>3 天前</strong>完成。</div>
      <div class="desktop-only table-wrap">
        <table class="desktop-table">
          <thead>
            <tr><th>時段</th>${dates.map(d => `<th>週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('')}</tr>
          </thead>
          <tbody>
            ${PERIODS.map((label, pIdx) => `
              <tr>
                <th>${label}</th>
                ${dates.map(d => {
                  const cell = getCellContent(d, pIdx, false);
                  return `<td><div class="slot-wrapper ${cell.isDisabled ? 'disabled' : ''} ${cell.isClickDisabled ? 'disabled-click' : ''}">${cell.html}</div></td>`;
                }).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="mobile-only">
        ${dates.map(d => {
          let col = `<div class="day-column"><div class="day-header">週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></div>`;
          PERIODS.forEach((label, pIdx) => {
            const cell = getCellContent(d, pIdx, false);
            col += `<div class="mobile-slot ${cell.isDisabled ? 'disabled' : ''} ${cell.isClickDisabled ? 'disabled-click' : ''}"><div class="mobile-period-label">${label}</div>${cell.html}</div>`;
          });
          col += `</div>`; return col;
        }).join('')}
      </div>
    `;
  }

  function renderModal(){
    const { date, periodIdx } = state.modal;
    const d = new Date(date + 'T00:00:00');
    const day = d.getDay();
    const activeCarts = state.filterLocation ? state.carts.filter(c => (c.location || '').trim() === state.filterLocation) : state.carts;
    const availableCarts = activeCarts.filter(c => {
      if (!c.enabled) return false;
      if ((c.blockedPeriods || []).includes(`${day}_${periodIdx}`)) return false;
      if (state.bookings[keyOf(date, periodIdx, c.cartId)]) return false;
      return true;
    });

    return `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h3>新增預約</h3>
          <div class="sub">${d.getMonth()+1}月${d.getDate()}日（週${WEEKDAY_LABEL[d.getDay()]}）· ${PERIODS[periodIdx]}</div>
          ${state.modalError ? `<div class="err">${escapeHtml(state.modalError)}</div>` : ''}
          <div class="field"><label>選擇平板車</label>
            <select id="inputCart">
              ${availableCarts.map(c => `<option value="${c.cartId}">${escapeHtml(c.name)}${c.location ? ' ('+escapeHtml(c.location)+')' : ''}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>使用班級</label><input type="text" id="inputClassName" placeholder="例如：701" autofocus></div>
          <!-- 💡 自動帶入老師名字 -->
          <div class="field" style="margin-bottom:0;"><label>任課教師</label><input type="text" id="inputTeacher" value="${escapeHtml(state.userData.name)}" placeholder="例如：王小明"></div>
          <div class="modal-actions">
            <button type="button" class="btn ghost" id="closeModal">取消</button>
            <button type="button" class="btn primary" id="confirmBookingBtn">確認登記</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderCartModal() {
    const c = state.cartModal;
    const isNew = !c.cartId;
    let gridHtml = `<table class="block-grid"><thead><tr><th></th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th></tr></thead><tbody>`;
    PERIODS.forEach((pName, pIdx) => {
      gridHtml += `<tr><td>${pName}</td>`;
      [1, 2, 3, 4, 5].forEach(day => {
        const isBlocked = (c.blockedPeriods || []).includes(`${day}_${pIdx}`);
        gridHtml += `<td class="grid-cell ${isBlocked ? 'is-blocked' : ''}" data-day="${day}" data-period="${pIdx}">${isBlocked ? '✖' : ''}</td>`;
      });
      gridHtml += `</tr>`;
    });
    gridHtml += `</tbody></table>`;

    return `
      <div class="overlay" id="cartOverlay">
        <div class="modal" style="max-width:480px;">
          <h3>${isNew ? '新增平板車' : '編輯平板車'}</h3>
          <div class="field"><label>名稱 (如: G車)</label><input type="text" id="cartName" value="${escapeHtml(c.name||'')}" placeholder="必填"></div>
          <div class="field" style="display:flex; gap:12px; flex-wrap:wrap;">
            <div style="flex:1; min-width:140px;"><label>放置地點</label><input type="text" id="cartLoc" value="${escapeHtml(c.location||'')}"></div>
            <div style="flex:1; min-width:140px;"><label>顏色標籤</label>
              <select id="cartTheme">${Object.keys(THEMES).map(k => `<option value="${k}" ${c.colorTheme===k?'selected':''}>${THEMES[k]}</option>`).join('')}</select>
            </div>
          </div>
          <div class="field" style="background:#f3f4f6; padding:10px 14px; border-radius:6px;">
            <label style="display:flex;align-items:center;gap:8px; cursor:pointer; margin-bottom:0; font-size:13.5px;">
              <input type="checkbox" id="cartEnabled" ${c.enabled!==false ? 'checked' : ''} style="width:16px; height:16px;"> 啟用開放預約
            </label>
          </div>
          <div class="field" style="margin-top:16px; margin-bottom:0;">
            <label>設定不開放節次 <span style="font-weight:500; color:var(--ink-soft); font-size:12px; margin-left:4px;">(點擊反紅代表不提供預約)</span></label>
            ${gridHtml}
          </div>
          <div class="modal-actions">
            <button type="button" class="btn ghost" id="closeCartModal">取消</button>
            <button type="button" class="btn primary" id="saveCartBtn">儲存設定</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderCancelConfirm(key){
    const b = state.bookings[key];
    if(!b){ return ''; }
    const d = new Date(b.date + 'T00:00:00');
    const cart = state.carts.find(c => c.cartId === b.cart) || {name: '未知'};
    return `
      <div class="overlay" id="cancelOverlay">
        <div class="modal" style="max-width:320px; text-align:center;">
          <h3 style="margin-bottom:10px;">取消借用</h3>
          <div class="sub" style="font-size:14.5px; color:#111827; line-height:1.6; margin-bottom:20px;">
            ${d.getMonth()+1}月${d.getDate()}日 · ${PERIODS[b.periodIdx]} · <strong>${escapeHtml(cart.name)}</strong><br>
            <span style="color:var(--ink-soft);">${escapeHtml(b.className)} / ${escapeHtml(b.teacher)}</span>
          </div>
          <div class="modal-actions" style="margin-top:0;">
            <button type="button" class="btn ghost" id="cancelConfirmNo">返回</button>
            <button type="button" class="btn danger" id="cancelConfirmYes">確定取消</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderDeleteCartConfirm(cartId) {
    const cart = state.carts.find(c => c.cartId === cartId) || {name: '未知'};
    return `
      <div class="overlay" id="deleteCartOverlay">
        <div class="modal" style="max-width:360px; text-align:center;">
          <h3 style="margin-bottom:10px; color:var(--danger);">刪除設備</h3>
          <div class="sub" style="font-size:14.5px; color:#111827; line-height:1.6; margin-bottom:20px;">
            確定要永久刪除 <strong>${escapeHtml(cart.name)}</strong> 嗎？<br><br>
            <div style="background:var(--danger-bg); border:1px solid #fecaca; border-radius:6px; padding:10px 14px; text-align:left;">
              <span style="color:var(--danger); font-weight:700; font-size:13px;">⚠️ 注意事項：</span><br>
              <span style="color:var(--danger); font-size:12.5px;">若此設備已有借用紀錄，刪除後歷史報表將無法顯示正確名稱。<br><br>若是設備報廢或送修，建議進入編輯使用「停用」功能即可。</span>
            </div>
          </div>
          <div class="modal-actions" style="margin-top:0;">
            <button type="button" class="btn ghost" id="deleteCartNo">返回</button>
            <button type="button" class="btn danger" id="deleteCartYes">確定永久刪除</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderAdmin(){
    const dates = weekDates(state.weekStart);
    return `
      <div class="admin-toolbar">
        <h3 style="font-size:18px;">本週借用總表 (點擊方塊可強制取消)</h3>
        ${renderWeekNav()}
      </div>
      <div class="desktop-only table-wrap" style="margin-bottom:24px;">
        <table class="desktop-table">
          <thead><tr><th>時段</th>${dates.map(d => `<th>週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('')}</tr></thead>
          <tbody>
            ${PERIODS.map((label, pIdx) => `<tr><th>${label}</th>${dates.map(d => {
                  const cell = getCellContent(d, pIdx, true);
                  return `<td><div class="slot-wrapper admin-mode ${cell.isDisabled ? 'disabled' : ''} ${cell.isClickDisabled ? 'disabled-click' : ''}">${cell.html}</div></td>`;
                }).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="mobile-only" style="margin-bottom:24px;">
        ${dates.map(d => {
          let col = `<div class="day-column"><div class="day-header">週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></div>`;
          PERIODS.forEach((label, pIdx) => {
            const cell = getCellContent(d, pIdx, true);
            col += `<div class="mobile-slot admin-mode ${cell.isDisabled ? 'disabled' : ''} ${cell.isClickDisabled ? 'disabled-click' : ''}"><div class="mobile-period-label">${label}</div>${cell.html}</div>`;
          });
          col += `</div>`; return col;
        }).join('')}
      </div>

      <div class="admin-toolbar" style="margin-top:28px;">
        <h3 style="font-size:18px;">設備管理中心</h3>
        <button class="btn primary" id="addCartBtn" style="padding:8px 14px; font-size:13px; flex:none;">＋ 新增平板車</button>
      </div>
      <div class="list-wrap" style="margin-bottom:28px;">
        <table class="list-table">
          <thead><tr><th>名稱</th><th>放置地點</th><th>標籤風格</th><th>狀態</th><th>操作</th></tr></thead>
          <tbody>
            ${state.carts.map(c => `
              <tr>
                <td style="font-weight:700; color:#111827;">${escapeHtml(c.name)}</td>
                <td>${escapeHtml(c.location || '-')}</td>
                <td><span class="theme-${c.colorTheme}" style="display:inline-block; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:600;">${THEMES[c.colorTheme]}</span></td>
                <td>${c.enabled ? '<span style="color:var(--ok); font-weight:600;">啟用中</span>' : '<span style="color:var(--ink-soft); font-weight:600;">已停用</span>'}</td>
                <td>
                  <button class="edit-link edit-cart-btn" data-id="${c.cartId}">編輯設定</button>
                  <button class="cancel-link delete-cart-btn" data-id="${c.cartId}" style="margin-left:6px;">刪除</button>
                </td>
              </tr>
            `).join('')}
            ${state.carts.length === 0 ? '<tr><td colspan="5" style="padding:30px; text-align:center; color:var(--ink-soft);">尚無平板車資料</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    `;
  }

  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; state.modal = state.cartModal = null; render(); });
    });
    
    const locationFilter = document.getElementById('locationFilter');
    if (locationFilter) locationFilter.addEventListener('change', (e) => { state.filterLocation = e.target.value; render(); });
    
    const logoutBtn = document.getElementById('logoutBtn');
    if(logoutBtn) logoutBtn.addEventListener('click', () => handleLogout(true));
    
    document.querySelectorAll('[data-nav]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const n = parseInt(btn.dataset.nav,10);
        state.weekStart = n===0 ? getMonday(new Date()) : addDays(state.weekStart, n*7); render();
      });
    });

    document.querySelectorAll('.add-booking-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.modal = { date: btn.dataset.date, periodIdx: parseInt(btn.dataset.period,10) }; state.modalError = null; render(); });
    });

    document.querySelectorAll('[data-cancel-key]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.confirmCancelKey = el.dataset.cancelKey; render(); });
    });

    const cancelConfirmYes = document.getElementById('cancelConfirmYes');
    if(cancelConfirmYes){
      cancelConfirmYes.addEventListener('click', async ()=>{
        cancelConfirmYes.disabled = true; cancelConfirmYes.textContent = '處理中…';
        try{
          await callServer('cancelBooking', state.confirmCancelKey);
          await refreshFromServer();
          state.confirmCancelKey = null; render(); showToast('已成功取消借用');
        }catch(err){ showToast('取消失敗，請檢查網路'); }
      });
    }
    const cancelOverlay = document.getElementById('cancelOverlay');
    if(cancelOverlay) cancelOverlay.addEventListener('click', (e)=>{ if(e.target === cancelOverlay){ state.confirmCancelKey = null; render(); } });
    const cancelConfirmNo = document.getElementById('cancelConfirmNo');
    if(cancelConfirmNo) cancelConfirmNo.addEventListener('click', ()=>{ state.confirmCancelKey = null; render(); });

    const overlay = document.getElementById('overlay');
    if(overlay) overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ state.modal=null; render(); } });
    const closeModal = document.getElementById('closeModal');
    if(closeModal) closeModal.addEventListener('click', ()=>{ state.modal=null; render(); });

    const confirmBookingBtn = document.getElementById('confirmBookingBtn');
    if(confirmBookingBtn) confirmBookingBtn.addEventListener('click', async ()=>{
      const inputCart = document.getElementById('inputCart');
      if(!inputCart || !inputCart.value){ state.modalError = '請選擇設備'; render(); return; }
      const cart = inputCart.value;
      const className = (document.getElementById('inputClassName').value || '').trim();
      const teacher = (document.getElementById('inputTeacher').value || '').trim().replace(/老師$/, '').trim();
      
      if(!className || !teacher){ state.modalError = '請完整填寫班級與教師資訊'; render(); return; }
      
      const { date, periodIdx } = state.modal;
      const d = new Date(date+'T00:00:00');
      if(!isBookable(d)){ state.modalError = '必須於使用日期 3 天前登記'; render(); return; }

      confirmBookingBtn.disabled = true; confirmBookingBtn.textContent = '資料同步中…';
      try{
        await refreshFromServer();
        const k = keyOf(date, periodIdx, cart);
        const cartConf = state.carts.find(c => c.cartId === cart);
        
        if(!cartConf || !cartConf.enabled || cartConf.blockedPeriods.includes(`${d.getDay()}_${periodIdx}`) || state.bookings[k]){
          state.modalError = '設備狀態異動或剛被預約，請重新選擇'; render(); return;
        }

        const bookingObj = { date, periodIdx, cart, className, teacher, qty: 1, createdAt: new Date().toISOString() };
        const result = await callServer('addBooking', k, bookingObj);
        
        state.bookings[k] = bookingObj; state.modal = null; render(); showToast('預約成功！');
      }catch(err){ state.modalError = '網路或權限異常，預約失敗'; render(); }
    });

    const addCartBtn = document.getElementById('addCartBtn');
    if (addCartBtn) addCartBtn.addEventListener('click', () => { state.cartModal = { enabled: true, blockedPeriods: [], colorTheme: 'blue' }; render(); });

    document.querySelectorAll('.edit-cart-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cartInfo = state.carts.find(c => c.cartId === btn.dataset.id);
        if (cartInfo) { state.cartModal = JSON.parse(JSON.stringify(cartInfo)); render(); }
      });
    });

    document.querySelectorAll('.delete-cart-btn').forEach(btn => {
      btn.addEventListener('click', () => { state.confirmDeleteCartId = btn.dataset.id; render(); });
    });

    const deleteCartYes = document.getElementById('deleteCartYes');
    if(deleteCartYes){
      deleteCartYes.addEventListener('click', async ()=>{
        deleteCartYes.disabled = true; deleteCartYes.textContent = '刪除中…';
        try{
          await callServer('deleteCart', state.confirmDeleteCartId);
          await refreshFromServer();
          state.confirmDeleteCartId = null; render(); showToast('設備已永久刪除');
        }catch(err){ showToast('刪除失敗，請檢查網路'); }
      });
    }
    const deleteCartOverlay = document.getElementById('deleteCartOverlay');
    if(deleteCartOverlay) deleteCartOverlay.addEventListener('click', (e)=>{ if(e.target === deleteCartOverlay){ state.confirmDeleteCartId = null; render(); } });
    const deleteCartNo = document.getElementById('deleteCartNo');
    if(deleteCartNo) deleteCartNo.addEventListener('click', ()=>{ state.confirmDeleteCartId = null; render(); });

    document.querySelectorAll('.grid-cell').forEach(cell => {
      cell.addEventListener('click', function() {
        this.classList.toggle('is-blocked');
        this.innerHTML = this.classList.contains('is-blocked') ? '✖' : '';
      });
    });

    const cartOverlay = document.getElementById('cartOverlay');
    if(cartOverlay) cartOverlay.addEventListener('click', (e)=>{ if(e.target === cartOverlay){ state.cartModal=null; render(); } });
    const closeCartModal = document.getElementById('closeCartModal');
    if(closeCartModal) closeCartModal.addEventListener('click', ()=>{ state.cartModal=null; render(); });

    const saveCartBtn = document.getElementById('saveCartBtn');
    if (saveCartBtn) {
      saveCartBtn.addEventListener('click', async () => {
        const name = document.getElementById('cartName').value.trim();
        if(!name) { showToast('設備名稱為必填欄位'); return; }
        
        const blockedPeriods = Array.from(document.querySelectorAll('.grid-cell.is-blocked')).map(cell => `${cell.dataset.day}_${cell.dataset.period}`);
        const payload = {
          cartId: state.cartModal.cartId || 'cart_' + Date.now(),
          name, location: document.getElementById('cartLoc').value.trim(),
          colorTheme: document.getElementById('cartTheme').value,
          enabled: document.getElementById('cartEnabled').checked,
          blockedPeriods
        };

        saveCartBtn.disabled = true; saveCartBtn.textContent = '儲存同步中...';
        try {
          await callServer('saveCart', payload);
          await refreshFromServer();
          state.cartModal = null; showToast('設備設定已更新');
        } catch(e) { showToast('儲存失敗，請檢查網路或權限'); }
        render();
      });
    }
  }

  // 啟動程式 (守門員第一時間介入)
  initGatekeeper();

})();
</script>
</body>
</html>
