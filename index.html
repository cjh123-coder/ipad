<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平板借用系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111827; --ink-soft: #4b5563; --bg-app: #f9fafb; --bg-panel: #ffffff;
    --border: #d1d5db; --border-soft: #e5e7eb; 
    --accent: #2563eb; --accent-soft: #eff6ff; --danger: #ef4444; --danger-bg: #fef2f2; --ok: #10b981;
    --radius: 8px; --radius-sm: 6px; --radius-pill: 99px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-app); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .app { max-width: 1040px; margin: 0 auto; padding: 24px 20px 80px; }
  
  .theme-blue { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
  .theme-green { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
  .theme-red { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
  .theme-orange { background: #fff7ed; color: #9a3412; border: 1px solid #ffedd5; }
  .theme-purple { background: #faf5ff; color: #6b21a8; border: 1px solid #f3e8ff; }
  .theme-gray { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }

  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: 24px; margin:0; }
  .topbar p { margin: 6px 0 0; color: var(--ink-soft); font-size: 13.5px; font-weight: 500; }
  
  .tabs { display: flex; gap: 4px; background: #e5e7eb; padding: 4px; border-radius: var(--radius-pill); }
  .tabs button { border: none; background: transparent; padding: 6px 14px; border-radius: var(--radius-pill); font-weight: 600; font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }

  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .nav-btn, .today-btn { border: 1px solid var(--border); background: var(--bg-panel); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-soft); padding: 6px 12px; }
  .notice { background: #f0fdf4; border: 1px solid #dcfce7; color: #166534; border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 500; margin-bottom: 20px; }

  .desktop-table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; border: 1px solid var(--border); }
  .desktop-table th, .desktop-table td { border: 1px solid var(--border-soft); }
  .desktop-table thead th { background: #f9fafb; padding: 12px 8px; font-size: 13.5px; }
  .desktop-table tbody th { background: #f9fafb; font-size: 13px; width: 65px; }
  
  .slot-wrapper { display: flex; flex-direction: column; gap: 6px; min-height: 72px; padding: 8px; box-sizing: border-box; }
  .slot-wrapper.disabled { background: #f9fafb; opacity: 0.85; pointer-events: none; }
  .slot-wrapper:not(.disabled):not(.admin-mode):hover { background: #f8fafc; box-shadow: inset 0 0 0 2px var(--accent); }

  .pill { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 4px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 700; }
  .pill .who { font-weight: 500; font-size: 11.5px; opacity: 0.85; }
  .x-btn { position: absolute; right: -5px; top: -5px; background: var(--danger); color: white; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; pointer-events: auto; }
  
  .add-booking-btn { background: #fff; border: 1px dashed var(--accent); color: var(--accent); border-radius: var(--radius-sm); padding: 6px 4px; font-size: 12.5px; font-weight: 700; cursor: pointer; opacity: 0; pointer-events: none; }
  .slot-wrapper:not(.disabled):hover .add-booking-btn { opacity: 1; pointer-events: auto; }
  .status-text { font-size: 12px; font-weight: 600; color: #9ca3af; text-align: center; margin-top: 8px; }
  
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding:20px; }
  .modal { background: white; border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; max-height: 90vh; overflow-y: auto; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; }
  .btn { padding: 10px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 600; cursor: pointer; flex:1; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: var(--bg-app); border: 1px solid var(--border); }
  .btn.danger { background: var(--danger); color: #fff; }
  
  .block-grid { width: 100%; border-collapse: collapse; margin-top: 8px; font-size:12.5px; }
  .block-grid th, .block-grid td { border: 1px solid var(--border); padding: 4px; text-align: center; }
  .block-grid td.grid-cell { cursor: pointer; }
  .block-grid td.is-blocked { background: var(--danger-bg); color: var(--danger); }
  
  .list-table { width: 100%; border-collapse: collapse; font-size: 13.5px; background:white; }
  .list-table th, .list-table td { border-bottom: 1px solid var(--border); padding: 12px; text-align: left; }
  
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 20px; border-radius: var(--radius-pill); z-index: 100; }
  
  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
    .mobile-only { display: flex; flex-direction: column; gap: 20px; }
    .mobile-slot { border: 1px solid var(--border); padding: 14px; background: white; margin-bottom:10px; border-radius:8px;}
    .add-booking-btn { opacity: 1; pointer-events: auto; padding: 10px; }
  }
  .desktop-only { display: block; }
  .mobile-only { display: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="padding:100px; text-align:center;"><h2 style="color:#2563eb;">🔄 系統載入中...</h2></div>
</div>

<script>
(function(){
  const SSO_CENTER_URL = "https://cjh123-coder.github.io/sso/"; 
  const CURRENT_APP_URL = "https://cjh123-coder.github.io/ipad/";
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwX6yX7iE4XFDltH1CnwUv937Ezl8a0thiveCFlr7Pat5jQJGrl76VTjdmluZ6ASY3f/exec"; 

  const PERIODS = ['第一節','第二節','第三節','第四節','第五節','第六節','第七節','第八節'];
  const WEEKDAY_LABEL = ['日','一','二','三','四','五','六'];
  const THEMES = { blue:'藍色', green:'綠色', red:'紅色', orange:'橘黃', purple:'紫色', gray:'灰色' };

  let state = {
    tab: 'teacher', viewStart: getStartOfToday(),
    bookings: {}, carts: [], sysSettings: { minLeadDays: 3, maxBookingDays: 7, maxWeeklyPeriods: 5 },
    modal: null, cartModal: null, loaded: false, userData: null, toast: null, confirmCancelKey: null, filterLocation: ''
  };

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function fmt(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getStartOfToday(){ const t = new Date(); t.setHours(0,0,0,0); return t; }
  function daysBetween(a,b){ return Math.round((b.getTime() - a.getTime())/86400000); }
  function keyOf(d, p, c){ return d+'|'+p+'|'+c; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function checkIsAdmin(user) { return user && ['admin', 'assistant', 'director', 'headmaster'].includes(user.roleId); }

  // 💡 滾動日曆引擎：跳過六日，取得未來的連續 X 個工作日
  function getBusinessDays(start, count) {
    let days = []; let d = new Date(start);
    while (days.length < count) {
      if (d.getDay() !== 0 && d.getDay() !== 6) days.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return days;
  }
  
  function shiftBusinessDays(date, delta) {
    let d = new Date(date); let added = 0;
    let dir = delta > 0 ? 1 : -1;
    while(added < Math.abs(delta)){
      d.setDate(d.getDate() + dir);
      if(d.getDay() !== 0 && d.getDay() !== 6) added++;
    }
    return d;
  }

  function showToast(msg){
    state.toast = msg; render();
    setTimeout(()=> { state.toast = null; render(); }, 3000);
  }

  async function callServer(fnName, ...args) {
    const sessionId = localStorage.getItem('ipadSessionId') || "";
    const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: fnName, args: args, sessionId }) });
    const result = await res.json();
    if (result.status === 'success') return result.data;
    if (result.message.includes("Session") || result.message.includes("重新登入")) {
      handleLogout(false); throw new Error("EXPIRED");
    }
    throw new Error(result.message);
  }

  async function handleLogout(notifyServer = true) {
    if(notifyServer) try { await callServer('logoutSession'); } catch(e) {}
    localStorage.clear();
    window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
  }

  async function initGatekeeper() {
    const token = new URLSearchParams(window.location.search).get('token');
    if (token) {
      const res = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'verifyIpadLogin', args: [token] }) }).then(r=>r.json());
      if (res.status === 'success' && res.data.success) {
        localStorage.setItem('ipadUserData', JSON.stringify(res.data.userData));
        localStorage.setItem('ipadSessionId', res.data.sessionId);
        window.location.replace(CURRENT_APP_URL);
      } else { handleLogout(false); }
      return;
    }
    if (localStorage.getItem('ipadUserData') && localStorage.getItem('ipadSessionId')) {
      state.userData = JSON.parse(localStorage.getItem('ipadUserData'));
      loadInitialData();
    } else { handleLogout(false); }
  }

  async function loadInitialData(){
    try {
      const [b, c, s] = await Promise.all([ callServer('getBookings'), callServer('getCarts'), callServer('getSettings') ]);
      state.bookings = b||{}; state.carts = c||[]; state.sysSettings = s||state.sysSettings;
    } catch(e){}
    state.loaded = true; render();
  }

  function render(){
    if(!state.loaded) return;
    document.getElementById('app').innerHTML = `
      ${renderTopbar()}
      ${state.tab === 'teacher' ? renderTeacher() : renderAdmin()}
      ${state.modal ? renderModal() : ''}
      ${state.cartModal ? renderCartModal() : ''}
      ${state.confirmCancelKey ? renderCancelConfirm() : ''}
      ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
    `;
    bindEvents();
  }

  function renderTopbar(){
    const activeCarts = state.carts.filter(c => c.enabled);
    const adminTag = checkIsAdmin(state.userData) ? ' (管理員)' : '';
    return `
      <div class="topbar">
        <div><h1>平板借用系統</h1><p>全校開放 ${activeCarts.length} 台設備 · 歡迎，<strong style="color:var(--accent);">${escapeHtml(state.userData.name)}</strong> 老師${adminTag}</p></div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="tabs">
            <button data-tab="teacher" class="${state.tab==='teacher'?'active':''}">設備預約</button>
            ${checkIsAdmin(state.userData) ? `<button data-tab="admin" class="${state.tab==='admin'?'active':''}">管理後台</button>` : ''}
          </div>
          <button class="btn ghost" style="padding:6px 12px; font-size:12px;" id="logoutBtn">登出</button>
        </div>
      </div>
    `;
  }

  function getCellContent(date, periodIdx, adminMode){
    const dateStr = fmt(date);
    const day = date.getDay();
    const today = getStartOfToday();
    const diffDays = daysBetween(today, date);
    const activeCarts = state.filterLocation ? state.carts.filter(c => (c.location || '').trim() === state.filterLocation) : state.carts;
    
    let html = '';
    const cellBookings = activeCarts.map(c => state.bookings[keyOf(dateStr, periodIdx, c.cartId)]).filter(b => b);
    
    cellBookings.forEach(b => {
      const cartInfo = activeCarts.find(c => c.cartId === b.cart) || {name: '未知', colorTheme: 'gray'};
      const isMine = !adminMode && b.teacher.indexOf(state.userData.name) !== -1;
      const canCancel = adminMode || (isMine && date.getTime() > today.getTime());
      
      const attr = canCancel ? `data-cancel-key="${keyOf(dateStr, periodIdx, b.cart)}" style="cursor:pointer;" title="點擊取消"` : `title="${escapeHtml(b.className)} / ${escapeHtml(b.teacher)}"`;
      const xBtn = canCancel ? `<div class="x-btn">✖</div>` : '';
      
      html += `<div class="pill theme-${cartInfo.colorTheme}" ${attr}>${xBtn}<span>${escapeHtml(cartInfo.name)}</span><span class="who">${escapeHtml(b.className)}</span></div>`;
    });

    const availableCarts = activeCarts.filter(c => {
      if (!c.enabled || (c.blockedPeriods || []).includes(`${day}_${periodIdx}`) || state.bookings[keyOf(dateStr, periodIdx, c.cartId)]) return false;
      if (!adminMode && c.reservedFor) {
        if (!c.reservedFor.split(',').map(s=>s.trim()).includes(state.userData.name)) return false;
      }
      return true;
    });

    let isDisabled = false;
    if (!adminMode) {
      if (diffDays < state.sysSettings.minLeadDays) { html += `<div class="status-text">未滿${state.sysSettings.minLeadDays}天</div>`; isDisabled = true; }
      else if (diffDays > state.sysSettings.maxBookingDays) { html += `<div class="status-text">尚未開放</div>`; isDisabled = true; }
      else if (availableCarts.length === 0 && activeCarts.length > 0) { html += `<div class="status-text">已額滿</div>`; isDisabled = true; }
      else if (availableCarts.length > 0) html += `<button class="add-booking-btn" data-date="${dateStr}" data-period="${periodIdx}">＋ 預約</button>`;
    } else {
      html += `<div class="status-text">管理模式</div>`;
    }
    return { html, isDisabled };
  }

  function renderTeacher(){
    const dates = getBusinessDays(state.viewStart, 5);
    const locs = [...new Set(state.carts.map(c => (c.location || '').trim()).filter(Boolean))];
    const locFilter = `<select id="locationFilter" style="padding:6px; border:1px solid var(--border); border-radius:4px;"><option value="">全部地點</option>${locs.map(l => `<option value="${escapeHtml(l)}" ${state.filterLocation===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}</select>`;
    
    return `
      <div class="weeknav">
        <div style="font-weight:700; font-size:15px;"><button class="nav-btn" data-nav="-5">‹</button> <span style="margin:0 10px;">快速切換日期</span> <button class="nav-btn" data-nav="5">›</button></div>
        <div style="display:flex; gap:8px;">${locFilter} <button class="today-btn" data-nav="today">回到今天</button></div>
      </div>
      <div class="notice">💡 防呆規則：至少 <strong>${state.sysSettings.minLeadDays} 天前</strong>預約，最遠預約 <strong>${state.sysSettings.maxBookingDays} 天</strong>，單週額度上限 <strong>${state.sysSettings.maxWeeklyPeriods} 節</strong>。可隨時於 1 天前自主點擊 ✖ 取消。</div>
      <div class="desktop-only table-wrap">
        <table class="desktop-table">
          <thead><tr><th>時段</th>${dates.map(d => `<th>週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('')}</tr></thead>
          <tbody>${PERIODS.map((label, pIdx) => `<tr><th>${label}</th>${dates.map(d => {
            const cell = getCellContent(d, pIdx, false);
            return `<td><div class="slot-wrapper ${cell.isDisabled ? 'disabled' : ''}">${cell.html}</div></td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    `;
  }

  function renderAdmin(){
    const dates = getBusinessDays(state.viewStart, 5);
    return `
      <div style="background:white; padding:15px; border:1px solid var(--border); border-radius:8px; margin-bottom:20px;">
        <h3>⚙️ 全域預約規則設定</h3>
        <div style="display:flex; gap:15px; margin-top:10px;">
          <div><label>提前天數</label><input type="number" id="sysMin" value="${state.sysSettings.minLeadDays}" style="width:70px; padding:4px;"></div>
          <div><label>最遠天數</label><input type="number" id="sysMax" value="${state.sysSettings.maxBookingDays}" style="width:70px; padding:4px;"></div>
          <div><label>單週節數上限</label><input type="number" id="sysWeek" value="${state.sysSettings.maxWeeklyPeriods}" style="width:70px; padding:4px;"></div>
          <div style="display:flex; align-items:flex-end;"><button id="saveSysBtn" class="btn primary" style="padding:6px 15px;">儲存規則</button></div>
        </div>
      </div>
      
      <div class="weeknav"><h3>強制管理總表 (點擊方塊可刪除任何預約)</h3><div style="display:flex; gap:8px;"><button class="nav-btn" data-nav="-5">‹</button><button class="today-btn" data-nav="today">回到今天</button><button class="nav-btn" data-nav="5">›</button></div></div>
      <div class="desktop-only table-wrap" style="margin-bottom:24px;">
        <table class="desktop-table">
          <thead><tr><th>時段</th>${dates.map(d => `<th>週${WEEKDAY_LABEL[d.getDay()]} <span class="date">${d.getMonth()+1}/${d.getDate()}</span></th>`).join('')}</tr></thead>
          <tbody>${PERIODS.map((label, pIdx) => `<tr><th>${label}</th>${dates.map(d => `<td><div class="slot-wrapper admin-mode">${getCellContent(d, pIdx, true).html}</div></td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>

      <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><h3>設備管理中心</h3><button class="btn primary" id="addCartBtn" style="padding:6px 12px;">＋ 新增平板車</button></div>
      <table class="list-table" style="margin-bottom:40px;">
        <thead><tr><th>名稱</th><th>放置地點</th><th>保留對象</th><th>操作</th></tr></thead>
        <tbody>
          ${state.carts.map(c => `<tr>
            <td style="font-weight:700;">${escapeHtml(c.name)} <span class="theme-${c.colorTheme}" style="padding:2px 6px; border-radius:4px; font-size:11px;">${THEMES[c.colorTheme]}</span></td>
            <td>${escapeHtml(c.location || '-')}</td>
            <td style="color:var(--danger); font-weight:600;">${escapeHtml(c.reservedFor || '全校開放')}</td>
            <td><button class="edit-cart-btn btn ghost" data-id="${c.cartId}" style="padding:4px 8px;">編輯</button> <button class="delete-cart-btn btn danger" data-id="${c.cartId}" style="padding:4px 8px;">刪除</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  function renderModal(){
    const { date, periodIdx } = state.modal;
    const d = new Date(date + 'T00:00:00');
    const day = d.getDay();
    const activeCarts = state.filterLocation ? state.carts.filter(c => (c.location || '').trim() === state.filterLocation) : state.carts;
    
    const availableCarts = activeCarts.filter(c => {
      if (!c.enabled || (c.blockedPeriods || []).includes(`${day}_${periodIdx}`) || state.bookings[keyOf(date, periodIdx, c.cartId)]) return false;
      if (!checkIsAdmin(state.userData) && c.reservedFor) {
        if (!c.reservedFor.split(',').map(s=>s.trim()).includes(state.userData.name)) return false;
      }
      return true;
    });

    return `
      <div class="overlay" id="overlay"><div class="modal">
        <h3>新增預約</h3><div style="color:var(--ink-soft); margin-bottom:15px;">${d.getMonth()+1}月${d.getDate()}日 · ${PERIODS[periodIdx]}</div>
        <div class="field"><label>選擇設備</label><select id="inputCart">${availableCarts.map(c => `<option value="${c.cartId}">${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>使用班級</label><input type="text" id="inputClassName" placeholder="701"></div>
        <div class="field"><label>任課教師</label><input type="text" id="inputTeacher" value="${escapeHtml(state.userData.name)}"></div>
        <div style="display:flex; gap:10px;"><button class="btn ghost" id="closeModal">取消</button><button class="btn primary" id="confirmBookingBtn">確定預約</button></div>
      </div></div>
    `;
  }

  function renderCartModal() {
    const c = state.cartModal;
    let gridHtml = `<table class="block-grid"><thead><tr><th></th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th></tr></thead><tbody>`;
    PERIODS.forEach((pName, pIdx) => {
      gridHtml += `<tr><td>${pName}</td>`;
      [1, 2, 3, 4, 5].forEach(day => {
        const isBlocked = (c.blockedPeriods || []).includes(`${day}_${pIdx}`);
        gridHtml += `<td class="grid-cell ${isBlocked ? 'is-blocked' : ''}" data-day="${day}" data-period="${pIdx}">${isBlocked ? '✖' : ''}</td>`;
      });
      gridHtml += `</tr>`;
    });
    gridHtml += `</tbody></table>`;

    return `
      <div class="overlay" id="cartOverlay"><div class="modal" style="max-width:500px;">
        <h3>平板車設定</h3>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;"><label>名稱</label><input type="text" id="cartName" value="${escapeHtml(c.name||'')}"></div>
          <div class="field" style="flex:1;"><label>地點</label><input type="text" id="cartLoc" value="${escapeHtml(c.location||'')}"></div>
          <div class="field"><label>標籤</label><select id="cartTheme">${Object.keys(THEMES).map(k => `<option value="${k}" ${c.colorTheme===k?'selected':''}>${THEMES[k]}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>限定對象 (留白代表全校開放，多筆以逗號分隔)</label><input type="text" id="cartReserved" value="${escapeHtml(c.reservedFor||'')}" placeholder="張三, 李四"></div>
        <div class="field" style="background:#f3f4f6; padding:10px; border-radius:6px;"><label style="margin:0;"><input type="checkbox" id="cartEnabled" ${c.enabled!==false ? 'checked' : ''}> 啟用開放預約</label></div>
        <div class="field"><label>不開放節次 (點擊反紅)</label>${gridHtml}</div>
        <div style="display:flex; gap:10px;"><button class="btn ghost" id="closeCartModal">取消</button><button class="btn primary" id="saveCartBtn">儲存設定</button></div>
      </div></div>
    `;
  }

  function renderCancelConfirm(){
    const b = state.bookings[state.confirmCancelKey];
    if(!b) return '';
    const cart = state.carts.find(c => c.cartId === b.cart) || {name: '未知'};
    return `
      <div class="overlay" id="cancelOverlay"><div class="modal" style="text-align:center;">
        <h3>確認取消預約？</h3>
        <p style="margin-bottom:20px;">${b.date} · ${PERIODS[b.periodIdx]} · <strong>${escapeHtml(cart.name)}</strong></p>
        <div style="display:flex; gap:10px;"><button class="btn ghost" id="cancelConfirmNo">返回</button><button class="btn danger" id="cancelConfirmYes">確定取消</button></div>
      </div></div>
    `;
  }

  function bindEvents(){
    document.querySelectorAll('[data-tab]').forEach(btn=>{ btn.addEventListener('click', ()=>{ state.tab = btn.dataset.tab; render(); }); });
    if (document.getElementById('locationFilter')) document.getElementById('locationFilter').addEventListener('change', (e) => { state.filterLocation = e.target.value; render(); });
    if (document.getElementById('logoutBtn')) document.getElementById('logoutBtn').addEventListener('click', () => handleLogout(true));
    
    document.querySelectorAll('[data-nav]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.nav === 'today') state.viewStart = getStartOfToday();
        else state.viewStart = shiftBusinessDays(state.viewStart, parseInt(btn.dataset.nav,10));
        render();
      });
    });

    document.querySelectorAll('.add-booking-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{ state.modal = { date: btn.dataset.date, periodIdx: parseInt(btn.dataset.period,10) }; render(); }); });
    document.querySelectorAll('[data-cancel-key]').forEach(el=>{ el.addEventListener('click', (e)=>{ e.stopPropagation(); state.confirmCancelKey = el.dataset.cancelKey; render(); }); });

    if(document.getElementById('cancelConfirmYes')) document.getElementById('cancelConfirmYes').addEventListener('click', async ()=>{
      try{ await callServer('cancelBooking', state.confirmCancelKey); await loadInitialData(); state.confirmCancelKey = null; showToast('已成功取消'); }
      catch(err){ showToast(err.message); }
    });
    if(document.getElementById('cancelConfirmNo')) document.getElementById('cancelConfirmNo').addEventListener('click', ()=>{ state.confirmCancelKey = null; render(); });
    if(document.getElementById('closeModal')) document.getElementById('closeModal').addEventListener('click', ()=>{ state.modal=null; render(); });

    if(document.getElementById('confirmBookingBtn')) document.getElementById('confirmBookingBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('confirmBookingBtn'); btn.disabled = true;
      try{
        await callServer('addBooking', keyOf(state.modal.date, state.modal.periodIdx, document.getElementById('inputCart').value), {
          date: state.modal.date, periodIdx: state.modal.periodIdx, cart: document.getElementById('inputCart').value,
          className: document.getElementById('inputClassName').value, teacher: document.getElementById('inputTeacher').value
        });
        state.modal = null; await loadInitialData(); showToast('預約成功！');
      }catch(err){ showToast(err.message); btn.disabled = false; }
    });

    // 系統參數設定
    if(document.getElementById('saveSysBtn')) document.getElementById('saveSysBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('saveSysBtn'); btn.disabled = true;
      try{
        await callServer('saveSettings', {
          minLeadDays: document.getElementById('sysMin').value, maxBookingDays: document.getElementById('sysMax').value, maxWeeklyPeriods: document.getElementById('sysWeek').value
        });
        await loadInitialData(); showToast('規則已更新');
      }catch(err){ showToast('更新失敗'); btn.disabled = false; }
    });

    if(document.getElementById('addCartBtn')) document.getElementById('addCartBtn').addEventListener('click', () => { state.cartModal = { enabled: true, blockedPeriods: [], colorTheme: 'blue' }; render(); });
    document.querySelectorAll('.edit-cart-btn').forEach(btn => { btn.addEventListener('click', () => { state.cartModal = state.carts.find(c => c.cartId === btn.dataset.id); render(); }); });
    document.querySelectorAll('.delete-cart-btn').forEach(btn => { btn.addEventListener('click', async () => { if(confirm('確定刪除此設備？')) { await callServer('deleteCart', btn.dataset.id); await loadInitialData(); showToast('已刪除'); } }); });

    document.querySelectorAll('.grid-cell').forEach(cell => { cell.addEventListener('click', function() { this.classList.toggle('is-blocked'); this.innerHTML = this.classList.contains('is-blocked') ? '✖' : ''; }); });
    if(document.getElementById('closeCartModal')) document.getElementById('closeCartModal').addEventListener('click', ()=>{ state.cartModal=null; render(); });

    if (document.getElementById('saveCartBtn')) document.getElementById('saveCartBtn').addEventListener('click', async () => {
      try {
        await callServer('saveCart', {
          cartId: state.cartModal.cartId || 'cart_' + Date.now(), name: document.getElementById('cartName').value,
          location: document.getElementById('cartLoc').value, colorTheme: document.getElementById('cartTheme').value,
          enabled: document.getElementById('cartEnabled').checked, reservedFor: document.getElementById('cartReserved').value,
          blockedPeriods: Array.from(document.querySelectorAll('.grid-cell.is-blocked')).map(cell => `${cell.dataset.day}_${cell.dataset.period}`)
        });
        state.cartModal = null; await loadInitialData(); showToast('設備已更新');
      } catch(e) { showToast('儲存失敗'); }
    });
  }

  initGatekeeper();
})();
</script>
</body>
</html>
